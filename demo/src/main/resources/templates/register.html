<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register — Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-icon">🛒</div>
                <h1>Create Account</h1>
                <p>Join the marketplace today</p>
            </div>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <!-- OTP Verification Form -->
            <form th:if="${showOtp}" method="post" th:action="@{/register}" class="auth-form">
                <input type="hidden" name="username" th:value="${username}"/>
                <input type="hidden" name="email" th:value="${email}"/>
                <input type="hidden" name="password" value=""/>
                <input type="hidden" name="fullName" th:value="${fullName}"/>
                <div class="form-group">
                    <label for="otpCode">Verification Code (2FA)</label>
                    <input type="text" id="otpCode" name="otpCode" placeholder="Enter 6-digit code" maxlength="6" required/>
                    <small class="form-hint">Check the console/logs for your OTP code</small>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Verify & Complete Registration</button>
            </form>

            <!-- Registration Form -->
            <form th:unless="${showOtp}" method="post" th:action="@{/register}" class="auth-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required/>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required/>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required/>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required/>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a th:href="@{/login}">Sign in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
