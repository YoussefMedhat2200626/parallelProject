<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CSV Import — Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><span class="logo-icon">🛒</span><span class="brand-text">Marketplace</span></div>
        <div class="nav-links">
            <a th:href="@{/dashboard}" class="nav-link">Dashboard</a>
            <a th:href="@{/search}" class="nav-link">Browse</a>
            <a th:href="@{/items}" class="nav-link active">My Items</a>
            <a th:href="@{/wallet}" class="nav-link">Wallet</a>
            <a th:href="@{/reports}" class="nav-link">Reports</a>
        </div>
        <div class="nav-user">
            <span class="user-greeting" th:text="'Hi, ' + ${session.fullName}"></span>
            <a th:href="@{/logout}" class="btn btn-sm btn-outline">Logout</a>
        </div>
    </nav>
    <main class="container">
        <h2 class="page-title">CSV Product Import</h2>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${importResult}" class="import-results">
            <p>✅ <strong th:text="${importResult.successCount}">0</strong> imported</p>
            <p th:if="${importResult.failCount > 0}">❌ <strong th:text="${importResult.failCount}">0</strong> failed</p>
            <ul th:if="${!importResult.errors.isEmpty()}" class="error-list">
                <li th:each="err : ${importResult.errors}" th:text="${err}"></li>
            </ul>
        </div>
        <div class="form-card">
            <div class="csv-info">
                <p>CSV columns: <code>name,description,brand,category,price,quantity</code></p>
                <pre>name,description,brand,category,price,quantity
iPhone 15,Latest smartphone,Apple,Electronics,999.99,10</pre>
            </div>
            <form th:action="@{/items/import}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="file">Select CSV File</label>
                    <input type="file" id="file" name="file" accept=".csv" required/>
                </div>
                <button type="submit" class="btn btn-primary">📤 Import</button>
            </form>
        </div>
    </main>
</body>
</html>
